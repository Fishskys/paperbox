# paperbox 应用自身的 compose（依赖服务见 infra/docker-compose.yml）。
#
# 两种接法，按部署环境选：
#   A) 依赖跑在同一台宿主上：依赖地址用 127.0.0.1:PORT，容器内用
#      host.docker.internal 回宿主（Linux 引擎不自带该名字，下面显式声明）。
#   B) 依赖与应用在同一个 docker 网络：把 .env 里的 *_URL 换成服务名即可
#      （postgres:5432 / opensearch:9200 / minio:9000 / embedding:8090），
#      此时把两侧 compose 加入同一 external 网络即可，extra_hosts 可去掉。
#
# 首次启动前先应用迁移（在仓库根执行一次）：
#   .venv/bin/python -m alembic upgrade head && .venv/bin/python scripts/create_index.py
name: paperbox-app

services:
  api:
    build: .
    image: paperbox/api:0.6.1
    container_name: paperbox-api
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAPER_API_HOST: 0.0.0.0
      PAPER_API_PORT: "8077"
    ports:
      - "8077:8077"
    # 故意不设 healthcheck：本项目的依赖探测是只按需的（启动一次 + 调用 /health 时），
    # compose 的 healthcheck 是定时轮询，与该策略冲突。健康状态看 /health 的
    # `degraded` 字段或 scripts/healthcheck.py；进程崩溃由 restart 策略拉起。
