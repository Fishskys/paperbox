# paperbox 应用自身的 compose（依赖服务不在这里，见 infra/docker-compose.yml）
#
# 两种接法，按部署环境选：
#   A) 依赖跑在**同一台宿主**上（本机/dev 默认）：依赖用 127.0.0.1:PORT，
#      容器内需要把 host.docker.internal 指回宿主 —— Linux 上 Docker 引擎不自带这个名字，
#      所以下面显式写了 extra_hosts（Docker Desktop 上重复声明无副作用）。
#   B) 依赖与应用在**同一个 docker 网络**里：把 .env 里的 *_URL 换成服务名即可
#      （postgres:5432 / opensearch:9200 / minio:9000 / embedding:8090），
#      此时 extra_hosts 用不上，把两侧 compose 加入同一 external 网络即可。
#
# 首次启动前先应用迁移（在仓库根执行一次，二选一）：
#   Linux/macOS:  .venv/bin/python -m alembic upgrade head && .venv/bin/python scripts/create_index.py
#   Windows dev:  .venv\Scripts\python.exe -m alembic upgrade head
name: paperbox-app

services:
  api:
    build: .
    image: paperbox/api:0.5.3
    container_name: paperbox-api
    restart: unless-stopped
    env_file:
      - .env
    # Linux 必需（host-gateway 需要 Docker 20.10+）；Docker Desktop 自带该名字，声明了也无妨
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PAPER_API_HOST: 0.0.0.0
      PAPER_API_PORT: "8077"
    ports:
      - "8077:8077"
    # 没有 healthcheck（2026-10-14 定论）：compose 的 healthcheck 是**定时轮询**，
    # 而本项目的探测策略是**只按需**（启动一次 + 调用 /health 时）—— 接了第三方
    # embedding API 后，定时探针就是定时计费。`docker ps` 因此不显示 healthy 字样；
    # 要看健康状况就调 /health（或 scripts/healthcheck.py），它给出 degraded 与逐项状态。
    # No healthcheck (2026-10-14): a compose healthcheck polls on a timer, and this
    # project probes on demand only (once at startup, then whenever /health is called)
    # -- a timer would bill a third-party embedding API on every tick. `docker ps` will
    # not show a health status; call /health (or scripts/healthcheck.py) instead: it
    # reports `degraded` plus the per-dependency verdicts.
