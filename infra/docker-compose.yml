# paperbox 依赖的基础设施 (PostgreSQL / OpenSearch / MinIO / Embedding / 可选 Docling)。
# paperbox 应用本身不在这里运行。启动: cd <repo>/infra && docker compose up -d --build
# 数据默认落 ./data/<service>；服务器上在 infra/.env 里给 *_DATA_DIR 设绝对路径。
# 端口绑定默认 0.0.0.0，可用 PAPERBOX_BIND_IP 收敛；时区统一 TZ=Asia/Shanghai（可覆盖）。
# 各配置项的逐条说明以本文件内注释为准；infra/.env.example 是全部变量的清单与默认值。
name: paperbox
services:
  postgres:
    image: postgres:15.2-alpine
    container_name: paperbox-postgres
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: paperbox
      TZ: ${TZ:-Asia/Shanghai}
      PGTZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:5432:5432"
    volumes:
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paperbox"]
      interval: 10s
      timeout: 5s
      retries: 12

  opensearch:
    image: opensearchproject/opensearch:3.6.0
    container_name: paperbox-opensearch
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
      - plugins.security.disabled=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-ChangeMe-Initial-Admin-2026!}
      - DISABLE_TELEMETRY=true
      - TZ=${TZ:-Asia/Shanghai}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:9200:9200"
    volumes:
      - ${OPENSEARCH_DATA_DIR:-./data/opensearch}:/usr/share/opensearch/data
      - ${OPENSEARCH_BACKUP_DIR:-./data/opensearch-backups}:/mnt/backups
    command: ["opensearch", "-Epath.repo=/mnt/backups"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z-cpuv1
    container_name: paperbox-minio
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:9000:9000"
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:9001:9001"
    volumes:
      - ${MINIO_DATA_DIR:-./data/minio}:/data
      - /usr/share/zoneinfo/${TZ:-Asia/Shanghai}:/etc/localtime:ro
      - /usr/share/zoneinfo/${TZ:-Asia/Shanghai}:/usr/share/zoneinfo/${TZ:-Asia/Shanghai}:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  embedding:
    build: ./embedding
    image: paperbox/embedding-server:0.1
    container_name: paperbox-embedding
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-large}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
      RERANK_MODEL_FILE: ${RERANK_MODEL_FILE:-onnx/model.onnx}
      HF_ENDPOINT: "https://hf-mirror.com"
      HF_HUB_DISABLE_XET: "1"
      FASTEMBED_CACHE_PATH: /models
      RERANK_MAX_BATCH: ${RERANK_MAX_BATCH:-16}
      ORT_THREADS: ${ORT_THREADS:-4}
      MAX_BATCH: ${MAX_BATCH:-16}
      INFERENCE_WORKERS: ${INFERENCE_WORKERS:-1}
      INFERENCE_QUEUE_DEPTH: ${INFERENCE_QUEUE_DEPTH:-512}
      PORT: 8090
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:8090:8090"
    volumes:
      - ${EMBEDDING_MODELS_DIR:-./data/embedding-models}:/models
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8090/health', timeout=5).status==200 else sys.exit(1)\""]
      interval: 15s
      timeout: 10s
      retries: 30

  # ── Docling 解析服务（可选，默认不启动）─────────────────────────────────
  # 用途: 第二个（主）PDF 解析后端；pypdf 保留为降级后端。放 profile 后面：
  #   要启用: cd infra && docker compose --profile local-docling up -d docling
  #
  # 官方镜像选择（docling-project 官方发布，quay.io / ghcr.io 双源，tag 用版本号勿用 latest）：
  #   docling-serve-cpu   CPU-only，本模块默认用这个，~4.4GB，linux/amd64+arm64
  #   docling-serve       完整版（PyPI 全量，含 CUDA 依赖包），~8.7GB，amd64+arm64
  #   docling-serve-cu128 CUDA 12.8，有 NVIDIA GPU 时用，~11.4GB，仅 amd64
  #   docling-serve-cu130 CUDA 13.0，较新 GPU，amd64+arm64
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    profiles: ["local-docling"]
    container_name: paperbox-docling
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    environment:
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_LOG_LEVEL: "WARNING"
      TZ: ${TZ:-Asia/Shanghai}
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_MAX_SYNC_WAIT: "300"
      DOCLING_SERVE_ENABLE_MANAGEMENT_ENDPOINTS: "true"
      DOCLING_NUM_THREADS: "4"
      DOCLING_DEVICE: "cpu"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
    ports:
      - "${PAPERBOX_BIND_IP:-0.0.0.0}:8091:5001"
    mem_limit: ${DOCLING_MEM_LIMIT:-3000m}
    memswap_limit: ${DOCLING_MEM_LIMIT:-3000m}
    cpus: ${DOCLING_CPUS:-4}
    volumes:
      - ${DOCLING_DATA_DIR:-./data/docling}:/var/lib/docling
      # 公式/代码识别模型挂载点（不需要公式解析就保持注释状态）：
      # 目录名必须是 `docling-project--CodeFormulaV2`（HF 仓库名的 `--` 变体）。
      # 取好模型目录后取消下一行注释，把宿主目录挂进容器缓存路径；
      # - ./models/docling-project--CodeFormulaV2:/your/path/models/docling-project--CodeFormulaV2:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5001/health', timeout=5).status==200 else sys.exit(1)\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 180s
